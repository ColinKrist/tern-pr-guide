# One page of one search. src/github.luau runs it for `mine` ($q = "is:pr is:open author:@me archived:false"),
# `requested` ("is:pr is:open review-requested:@me archived:false") and `reviewed`
# ("is:pr is:open reviewed-by:@me -author:@me archived:false") at once, renaming the alias, 20 PRs a page up to 50.
# Measured 2026-10-12: a 20-PR page costs 1 point and 4.5-6.4 s on busy repos (vscode, next.js). The three searches
# as one query of 50 each cost 11 points and got HTTP 502 after about 11 s, GitHub's execution limit, as did a
# single search of 50. A dropped page is asked again with $n halved, down to 5. Never add thread authors here: 159 points.
# The first `mine` page of a refresh adds `addedN: repository(owner:, name:) { pullRequest(number:) { ...Hub } }` per PR added by link, before the fragment.
query Hub($q: String!, $n: Int!, $after: String) {
  viewer { login }
  rateLimit { cost remaining resetAt limit used nodeCount }
  mine: search(type: ISSUE, query: $q, first: $n, after: $after) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes { ...Hub }
  }
}

fragment Hub on PullRequest {
  id
  number
  title
  url
  isDraft
  createdAt
  updatedAt
  headRefOid
  baseRefName
  additions
  deletions
  changedFiles
  author { __typename login }
  repository { nameWithOwner }
  reviewDecision
  mergeable
  mergeStateStatus
  totalCommentsCount
  autoMergeRequest { enabledAt }
  timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) { nodes { ... on RemovedFromMergeQueueEvent { createdAt reason } } }
  commits(last: 1) { nodes { commit { committedDate statusCheckRollup { state contexts(first: 0) { totalCount checkRunCountsByState { state count } statusContextCountsByState { state count } } } } } }
  latestReviews(first: 20) {
    nodes { author { __typename login } state submittedAt commit { oid } }
  }
  reviewRequests(first: 20) {
    nodes { requestedReviewer {
      __typename
      ... on User { login }
      ... on Team { slug }
    } }
  }
  reviewThreads(first: 100) { totalCount nodes { isResolved } }
  comments(last: 1) { totalCount nodes { updatedAt author { login } } }
}
